<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Login</title>
  </head>

  <body>
    <main class="auth-container">
      <h1>Welcome Back</h1>

      <p class="welcome-message">Login to your account</p>

      <form>
        <div class="form-group">
          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Miku Nakano"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
          />
        </div>

        <a class="auth-link forgot-password" href="#"> Forgot Password? </a>

        <button type="submit" id="auth-button">Login</button>
      </form>

      <p>
        Don't have an account?
        <a class="auth-link" href="signup.html">Sign Up</a>
      </p>
    </main>
  </body>
</html>
